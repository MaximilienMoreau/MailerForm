version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      # Keep compatible updates together; major upgrades remain separate for review.
      compatible-npm-updates:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 2
    groups:
      compatible-action-updates:
        patterns: ['*']
        update-types: [minor, patch]
